[project]
name = "depcouncil"
version = "0.1.0"
description = "A council of AI agents that debates whether to adopt an open-source dependency, with point-in-time backtesting."
readme = "README.md"
authors = [
    { name = "euisungkang", email = "euisungkang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic,openai]>=2.62.0",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.0",
    "rich>=14.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# Gemini models ("google-gla:..." / "google-vertex:..."). Anthropic and OpenAI-compatible
# providers are in the core install.
google = ["pydantic-ai-slim[google]>=2.62.0"]

[project.scripts]
depcouncil = "depcouncil.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.per-file-ignores]
# Pydantic copies mutable field defaults per instance; ruff only recognises direct BaseModel
# subclasses as models.
"src/depcouncil/data/*" = ["RUF012"]
